name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Add LunarG Vulkan SDK apt repo
        run: |
          sudo wget -qO /etc/apt/trusted.gpg.d/lunarg.asc \
            https://packages.lunarg.com/lunarg-signing-key-pub.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update

      - name: Install build dependencies
        run: |
          sudo apt-get install -y \
            clang-18 \
            meson \
            ninja-build \
            vulkan-headers \
            libvulkan-dev \
            libglfw3-dev \
            libsimdjson-dev \
            libglm-dev

      - name: Build
        run: |
          CC=clang-18 CXX=clang++-18 meson setup build --buildtype=release
          ninja -C build

      - name: Package tarball
        run: |
          DEST=catfish-engine-${{ github.ref_name }}-linux-x86_64
          mkdir -p "$DEST/shaders" "$DEST/models" "$DEST/lib"
          cp build/catfish_client build/catfish_server "$DEST/"
          cp shaders/vert.spv shaders/frag.spv "$DEST/shaders/"
          cp models/goblin.glb "$DEST/models/"

          # Bundle runtime shared libs — exclude Vulkan (GPU driver) and kernel/libc
          ldd build/catfish_client | awk '{print $3}' | grep '^/' \
            | grep -Ev 'libvulkan|libc\.|libm\.|libdl\.|libpthread\.|librt\.|libutil\.|linux-vdso|ld-linux' \
            | xargs -I{} cp -L {} "$DEST/lib/"

          # Launch script: sets LD_LIBRARY_PATH so bundled libs take precedence
          {
            echo '#!/bin/sh'
            echo 'D="$(dirname "$(readlink -f "$0")")"'
            echo 'export LD_LIBRARY_PATH="$D/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"'
            echo 'exec "$D/catfish_client" "$@"'
          } > "$DEST/catfish_client.sh"
          chmod +x "$DEST/catfish_client.sh"

          tar czf "${DEST}.tar.gz" "$DEST/"

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: catfish-engine-${{ github.ref_name }}-linux-x86_64.tar.gz
