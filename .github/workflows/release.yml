name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add LunarG Vulkan SDK apt repo
        run: |
          sudo wget -qO /etc/apt/trusted.gpg.d/lunarg.asc \
            https://packages.lunarg.com/lunarg-signing-key-pub.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update

      - name: Install build dependencies
        run: |
          sudo apt-get install -y \
            clang-18 \
            meson \
            ninja-build \
            vulkan-headers \
            libvulkan-dev \
            libglfw3-dev \
            libsimdjson-dev \
            libglm-dev

      - name: Build
        run: |
          CC=clang-18 CXX=clang++-18 meson setup build --buildtype=release
          ninja -C build

      - name: Package tarball
        run: |
          DEST=catfish-engine-${{ github.ref_name }}-linux-x86_64
          mkdir -p "$DEST/shaders" "$DEST/models" "$DEST/lib"
          cp build/catfish_client build/catfish_server "$DEST/"
          cp shaders/vert.spv shaders/frag.spv \
             shaders/projectile_vert.spv shaders/projectile_frag.spv "$DEST/shaders/"
          cp models/goblin.glb models/boulder.glb "$DEST/models/"

          # Bundle runtime shared libs — exclude Vulkan (GPU driver) and kernel/libc
          ldd build/catfish_client | awk '{print $3}' | grep '^/' \
            | grep -Ev 'libvulkan|libc\.|libm\.|libdl\.|libpthread\.|librt\.|libutil\.|linux-vdso|ld-linux' \
            | xargs -I{} cp -L {} "$DEST/lib/"

          # Launch script: sets LD_LIBRARY_PATH so bundled libs take precedence
          {
            echo '#!/bin/sh'
            echo 'D="$(dirname "$(readlink -f "$0")")"'
            echo 'export LD_LIBRARY_PATH="$D/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"'
            echo 'exec "$D/catfish_client" "$@"'
          } > "$DEST/catfish_client.sh"
          chmod +x "$DEST/catfish_client.sh"

          tar czf "${DEST}.tar.gz" "$DEST/"

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: catfish-engine-${{ github.ref_name }}-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan-loader
            mingw-w64-x86_64-glfw
            mingw-w64-x86_64-glm
            mingw-w64-x86_64-simdjson

      - name: Build
        run: |
          meson setup build --buildtype=release
          ninja -C build

      - name: Package zip
        run: |
          DEST="catfish-engine-${{ github.ref_name }}-windows-x86_64"
          mkdir -p "$DEST/shaders" "$DEST/models"

          cp build/catfish_client.exe build/catfish_server.exe "$DEST/"
          cp shaders/vert.spv shaders/frag.spv \
             shaders/projectile_vert.spv shaders/projectile_frag.spv "$DEST/shaders/"
          cp models/goblin.glb models/boulder.glb "$DEST/models/"

          # Bundle MinGW runtime + dependency DLLs; exclude the Vulkan loader since
          # users already have vulkan-1.dll through their GPU drivers (same as Linux).
          ldd build/catfish_client.exe \
            | awk '{print $3}' \
            | grep -i '/mingw64/' \
            | grep -iv 'vulkan-1' \
            | xargs -I{} cp -L {} "$DEST/"

          # Batch launcher: sets CWD to the game folder regardless of how it's invoked.
          printf '@echo off\r\ncd /d "%%~dp0"\r\nstart "" "%%~dp0catfish_client.exe" %%*\r\n' \
            > "$DEST/catfish_client.bat"

          "/c/Program Files/7-Zip/7z.exe" a "${DEST}.zip" "$DEST"

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: catfish-engine-${{ github.ref_name }}-windows-x86_64.zip
