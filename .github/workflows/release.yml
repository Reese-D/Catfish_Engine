name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  build:
    runs-on: ubuntu-24.04        # ships clang-18 + newer vulkan-headers (fixes raii.hpp bug)
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Add LunarG Vulkan SDK apt repo
        run: |
          sudo wget -qO /etc/apt/trusted.gpg.d/lunarg.asc \
            https://packages.lunarg.com/lunarg-signing-key-pub.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update

      - name: Install build dependencies
        run: |
          sudo apt-get install -y \
            clang-18 \
            vulkan-headers \
            libvulkan-dev \
            libglfw3-dev \
            libsimdjson-dev \
            libglm-dev

      - name: Mark compiled shaders as up-to-date
        run: touch shaders/vert.spv shaders/frag.spv

      - name: Build (static client libs)
        run: |
          make catfish_client catfish_server \
            CXX=clang++-18 CC=clang-18 \
            CLIENT_LIBS="-lvulkan \
              -Wl,-Bstatic -l:libglfw3.a -l:libsimdjson.a -Wl,-Bdynamic \
              third_party/fastgltf/libfastgltf.a \
              -static-libstdc++ -static-libgcc"

      - name: Verify static linking
        run: |
          echo "=== catfish_client dynamic deps ==="
          ldd catfish_client
          echo "=== catfish_server dynamic deps ==="
          ldd catfish_server

      - name: Package tarball
        run: |
          DEST=catfish-engine-${{ github.ref_name }}-linux-x86_64
          mkdir -p "$DEST/shaders" "$DEST/models"
          cp catfish_client catfish_server "$DEST/"
          cp shaders/vert.spv shaders/frag.spv "$DEST/shaders/"
          cp models/goblin.glb "$DEST/models/"
          tar czf "${DEST}.tar.gz" "$DEST/"

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: catfish-engine-${{ github.ref_name }}-linux-x86_64.tar.gz
